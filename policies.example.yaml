# Sift Policy Configuration Example
# Mode: shadow (audit only, do not alter prompt) | enforce (apply the actions below)
mode: shadow

# Actions per category:
#   pseudonymize  reversible token ([EMAIL_1]), restored in the response  <- default
#   redact        irreversible fixed tag ([EMAIL_REDACTED]), never restored
#   block         reject the whole request before it reaches the model (400)
#   pass          leave untouched (functional data the model needs)
policies:
  api_key:           pseudonymize   # or `block` if you'd rather reject such requests
  private_key:       pseudonymize
  password:          pseudonymize
  credit_card:       pseudonymize
  connection_string: pseudonymize
  email:             pseudonymize
  person_name:       pseudonymize
  ip_address:        pass           # left untouched

allowlist:
  - "example.com"
  - "127.0.0.1"

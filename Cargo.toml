[package]
name = "sift"
version = "0.3.0"
edition = "2021"
authors = ["Arturo Aguilera"]
description = "A local PII gateway and privacy proxy for AI coding agents."

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
once_cell = "1.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
colored = "2.1"
tower-http = { version = "0.5", features = ["cors", "trace"] }
dialoguer = "0.11"
daemonize = "0.5"
zeroize = "1"
gline-rs = "1"
orp = "0.9"
# Pull ONNX Runtime as a downloaded, statically-linked binary so `sift` is a single
# self-contained file (no dependency on a system libonnxruntime). Version pinned to the
# one gline-rs uses; feature unification enables the download for its ort too.
ort = { version = "=2.0.0-rc.9", features = ["download-binaries"] }

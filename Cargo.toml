[package]
name = "sift"
version = "0.1.0"
edition = "2021"
authors = ["Arturo Aguilera"]
description = "A local PII gateway and privacy proxy for AI coding agents."

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
once_cell = "1.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
colored = "2.1"
tower-http = { version = "0.5", features = ["cors", "trace"] }
